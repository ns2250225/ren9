# 数据源配置。status 字段为最近一次实测结论（scripts/check_sources.py 会重新实测并
# 把结果写入 data/cache/source_status.json；运行时以实测结果为准）。
sources:
  sporttery_zc:
    name: 中国体彩网 传统足彩（胜负彩/任选9场）
    kind: official
    base: https://webapi.sporttery.cn/gateway/lottery
    endpoints:
      schedule: /getFootBallMatchV1.qry?param=90,0&sellStatus=0&termLimits=10
      schedule_by_period: /getFootBallMatchV1.qry?param=90,0&lotteryDrawNum={period}&sellStatus=0&termLimits=10
      draw_by_period: /getFootBallDrawInfoByDrawNumV1.qry?isVerify=1&lotteryGameNum=90&lotteryDrawNum={period}
      latest_draw: /getFootBallDrawInfoV1.qry?isVerify=1&param=90,0
      history: /getHistoryPageListV1.qry?gameNo=90&provinceId=0&pageSize={page_size}&isVerify=1&pageNo={page}
    status: verified         # 2026-11-24 实测可用
    api_key: false
  sporttery_jc:
    name: 中国体育彩票 竞彩足球（胜平负/让球胜平负）
    kind: official
    base: https://webapi.sporttery.cn/gateway/jc/football
    endpoints:
      matches: /getMatchCalculatorV1.qry?poolCode=had,hhad&channel=c
    status: verified         # 2026-11-24 实测可用（赛果接口 getMatchResultV1 返回 403，不使用）
    api_key: false
  espn:
    name: ESPN 公开接口
    kind: public
    base: https://site.api.espn.com/apis
    endpoints:
      scoreboard: /site/v2/sports/soccer/{league}/scoreboard?dates={dates}
      standings: /v2/sports/soccer/{league}/standings
      summary: /site/v2/sports/soccer/{league}/summary?event={event}
      team_schedule: /site/v2/sports/soccer/{league}/teams/{team}/schedule
    status: verified         # 2026-11-24 实测可用（dates 支持 YYYYMMDD 与 YYYYMM，不支持区间）
    api_key: false
  football_data:
    name: football-data.co.uk
    kind: public
    base: https://www.football-data.co.uk
    endpoints:
      main: /mmz4281/{season}/{code}.csv
      extra: /new/{code}.csv
    status: verified         # 2026-11-24 实测可用（主要联赛 CSV 含 HxG/AxG）
    api_key: false
  clubelo:
    name: ClubElo
    kind: public
    base: http://api.clubelo.com
    endpoints:
      ratings: /{date}
    status: unreachable      # 2026-11-24 实测连接失败；不可用时自动降级为自算 Elo
    api_key: false
  understat:
    name: Understat
    kind: public
    base: https://understat.com
    endpoints:
      league: /getLeagueData/{league}/{season}
    status: unreachable      # 2026-11-24 实测返回维护页；不可用时改用 football-data.co.uk 的 xG 列
    api_key: false

