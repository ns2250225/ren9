odds_sources:
  sporttery_jc_had: {kind: official, label: 竞彩官方胜平负}
  sporttery_jc_hhad: {kind: official, label: 竞彩官方让球胜平负}
  sporttery_zc_ref: {kind: official, label: 体彩网赛单页参考赔率}
