# 模型权重与参数。
# initial 为初始配置。scripts/backtest.py（时间切分回测）或
# scripts/review_results.py --optimize-weights 学习到的参数写入同目录的
# model_weights.learned.yaml，运行时自动合并到下面的 learned 字段并优先使用
# （删除该文件即可恢复初始配置）。
ensemble:
  initial:
    elo: 0.15
    poisson: 0.20
    dixon_coles: 0.35
    market: 0.30
  # 学习权重时的约束：市场概率只是输入之一，不能单独决定最终概率；
  # 每个模型保留最低权重，保证没有赔率的比赛仍可由其余模型给出预测。
  max_market_weight: 0.60
  min_model_weight: 0.05
  use_learned: true
  learned: null            # {weights: {...}, temperature: 1.0, fitted_at: ..., samples: N, source: ...}

calibration:
  temperature: 1.0         # 概率校准温度（>1 压平，<1 锐化）；learned 存在时被覆盖

elo:
  home_advantage: 65       # 主场优势（Elo 分）
  draw_nu: 0.78            # Davidson 平局参数
  k_factor: 20             # 自算 Elo 的 K 值
  initial_rating: 1500

poisson:
  half_life_days: 240      # 时间衰减半衰期
  shrink_matches: 4        # 向联赛均值收缩的伪样本场数
  xg_blend: 0.4            # 有 xG 时，进球与 xG 的混合比例（0 = 只用进球）
  max_goals: 10

dixon_coles:
  half_life_days: 240
  ridge: 0.6               # 攻防参数的 L2 正则，样本少时防止过拟合
  max_goals: 10

form_adjust:
  # 用近期状态差、战意差对集成概率做小幅修正（对数几率平移：主胜 ×e^s，客胜 ×e^-s）。
  #   s = form_coef × 状态差（主 − 客，约 −1~1） + motivation_coef × 战意差（主 − 客）
  # scripts/backtest.py 会在历史数据上校准这两个系数并写入 learned；
  # 想固定使用下面的初始值，把 use_learned 设为 false。
  enabled: true
  form_coef: 0.15
  motivation_coef: 0.15
  max_shift: 0.04          # 任一项概率的最大变动（绝对值）
  use_learned: true
  learned: null            # {form_coef, motivation_coef, samples, fitted_at, ...}

lineup_adjust:
  # 主力缺阵修正：官方首发公布后（开球前约 1 小时），把本场首发与该队最近几场首发对比，
  # 常规首发这次没首发即记为缺阵。缺阵指数 0~1 = 缺阵主力的重要性 / 全部主力的重要性。
  #   s = coef × （客队缺阵指数 − 主队缺阵指数），再做与 form_adjust 相同的对数几率平移。
  # 没有历史首发数据可回测，coef 是未经校准的经验值；想关闭修正把 enabled 设为 false。
  enabled: true
  coef: 0.5
  max_shift: 0.04          # 任一项概率的最大变动（绝对值）
  regular_start_rate: 0.6  # 近期首发率达到该值才算主力
  min_games: 3             # 至少要有这么多场近期首发记录，否则缺阵情况记为未知
  bench_weight: 0.4        # 主力坐替补席（轮换）时按该比例计入缺阵
  rotation_baseline: 0.15  # 正常轮换下的典型缺阵指数；风险因子只计超出该值的部分

risk:
  # 各风险因子权重（因子取值 0~1；数据缺失的因子标记 unknown，不当作 0）
  weights:
    closeness: 0.28        # 概率接近
    disagreement: 0.18     # 模型分歧
    data_gap: 0.14         # 数据不足
    odds_move: 0.09        # 赔率波动
    lineup: 0.09           # 首发未公布 / 主力缺阵（由首发推断）
    fatigue: 0.07          # 赛程压力
    context: 0.08          # 赛事性质（杯赛、保级、争冠）
    form_motivation: 0.10  # 状态/战意是否支持推荐方向
  unknown_factor_value: 0.5   # unknown 因子按该值计入，并在报告中提示
  thresholds:
    low: 0.33
    medium: 0.52

selector:
  initial: {probability: 0.40, agreement: 0.20, data_quality: 0.15, risk: 0.25}
  learned: null
